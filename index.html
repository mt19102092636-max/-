function demoID(){const b='11010119900101001',w=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2];return b+'10X98765432'[[...b].reduce((s,n,i)=>s+Number(n)*w[i],0)%11]}
function validID(v){if(!/^[1-9]\d{16}[\dX]$/i.test(v))return false;const y=+v.slice(6,10),m=+v.slice(10,12),d=+v.slice(12,14),date=new Date(y,m-1,d);if(date.getFullYear()!==y||date.getMonth()!==m-1||date.getDate()!==d||date>new Date())return false;const w=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2];return '10X98765432'[[...v.slice(0,17)].reduce((s,n,i)=>s+Number(n)*w[i],0)%11]===v[17].toUpperCase()}
const maskID=v=>v?v.slice(0,3)+'***********'+v.slice(-4):'待填写';
const maskPhone=v=>v?v.slice(0,3)+'****'+v.slice(-4):'';
const hasAddress=()=>state.address.name.trim()&&/^1[3-9]\d{9}$/.test(state.address.phone)&&state.address.region.trim()&&state.address.detail.trim();
function stageOf(o){if(o.cancelled)return '已取消';if(o.accepted)return '审核中';return '待认证'}
function substage(o){if(o.cancelled)return '订单已取消';if(o.paidUnknown)return '支付结果确认中';if(!o.paid)return '待支付首期';if(o.syncUnknown)return '爱签结果同步中';if(o.signed)return '签署已完成，等待同步';if(o.certDone)return '待协议签署';return '已付款，待实名认证及签署'}
function canSupplement(o){return !!(o?.accepted&&!o.cancelled&&!state.hasUploadedId)}
function go(page){cancelAsync();state.modal=null;state.error={};state.tab='demo';let o=current();if(['auth','aiqian'].includes(page)&&(!o||!o.paid)){state.page=o?'order':'checkout';render();toast('请先完成首期付款，再进行实名认证与签署');return}if(['auth','aiqian'].includes(page)&&o.accepted)page='order';if(page==='photos'&&!canSupplement(o)){state.page='photos';render();return}if(page==='list')state.listTab=o?(o.cancelled?'已取消':o.accepted?'审核中':'待认证'):'全部';state.page=page;render()}
function preview(page){cancelAsync();state.modal=null;state.error={};if(['auth','aiqian'].includes(page)){const o=ensureOrderForPreview(true);if(page==='aiqian'){o.identity={name:'演示用户',id:demoID()};o.appConsent=true}state.page=page;state.tab='demo';render();toast('页面预览：载入已付款的待认证订单');return}if(['order','photos'].includes(page)){ensureOrderForPreview(true,true);go(page);toast('页面预览：载入待审核订单');return}go(page)}
function run(title,fn){if(state.busy)return;state.busy=true;state.modal={type:'busy',title};render();timer=setTimeout(()=>{state.busy=false;state.modal=null;fn();render()},650)}
function productHead(days=state.period){return `<div class="detail-product-head"><img class="detail-product-image" src="${detailAssets.pocket}" alt="大疆Pocket4Pro 商品图"><div class="detail-product-info"><h3>大疆Pocket4Pro 新品上市 电影画质 …</h3><p>租完归还 | 标准版（收纳包+数据线）| 1件</p><b>¥9.60/天</b></div></div>`}
function calendar(kind){return `<span class="detail-calendar ${kind}"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="8" width="20" height="20" rx="2"/><path d="M11 5v7m10-7v7M6 14h20"/><text x="16" y="24" text-anchor="middle" font-size="10" fill="currentColor" stroke="none">${kind==='start'?'始':'还'}</text></svg></span>`}
function rentDates(days){return `<div class="detail-rent-dates"><div class="detail-date">${calendar('start')}<span>预计起租日<small>${startDate}</small></span></div><span class="detail-duration">${days}天</span><div class="detail-date">${calendar('end')}<span>预计归还日<small>${endDate(days)}</small></span></div></div>`}
function bill(total){const paid=state.page==='order'?!!current()?.paid:false;return `<section class="card detail-fees" aria-label="费用明细"><div class="fee-row"><span>商品租金</span><span>¥${total}</span></div><div class="fee-row"><span>运费</span><span>¥0.00</span></div><div class="fee-row"><span>店铺优惠券</span><span class="fee-discount">−¥0.00</span></div><div class="fee-row"><span>平台优惠券</span><span class="fee-discount">−¥0.00</span></div><div class="fee-row"><span>配送方式</span><span>顺丰速运|寄出包邮 | 归还自付</span></div><div class="fee-row"><span>到期残值</span><span>不支持获取所有权</span></div><div class="fee-summary"><div class="fee-row"><span>${current()?.cancelled?'首期实付':paid?'首期实付':'首期待支付'}</span><span>¥${current()?.cancelled&&!paid?'0.00':total}</span></div><div class="fee-row fee-total"><span>合计：</span><b>¥${total}</b></div></div></section>`}
function productScreen(){return `<div class="phone-content product-page"><div class="product-showcase"><img src="${detailAssets.pocket}" alt="大疆Pocket4Pro"><span>新品上市 · 标准版</span></div><h2>大疆Pocket4Pro</h2><p class="product-subtitle">电影画质 · 租完归还 · 配件齐全</p><div class="product-day-price">¥<b>9.60</b><span> / 天</span></div><div class="card period-card"><h3>选择租期</h3><div class="period-buttons">${[7,15,30].map(d=>`<button data-period="${d}" class="${d===state.period?'selected':''}">${d}天</button>`).join('')}</div><div class="kv"><span>本次租金</span><span>¥${totals(state.period)}</span></div></div><div class="info-band">先付款生成订单，再完成实名认证与在线租赁协议签署。</div></div>`}
function field(key,label,value,placeholder,hint,attrs=''){return `<label class="field"><span class="field-label">${label}</span><input data-field="${key}" value="${esc(value)}" placeholder="${placeholder}" ${attrs}>${hint?`<small>${hint}</small>`:''}${state.error[key]?`<p class="error" role="alert">${esc(state.error[key])}</p>`:''}</label>`}
function addressScreen(){return `<div class="phone-content"><div class="card"><h3>收货信息</h3>${field('address.name','收货人',state.address.name,'请输入收货人姓名','','maxlength="30" autocomplete="off"')}${field('address.phone','手机号',state.address.phone,'请输入11位手机号','手机号用于联系与认证，无需在实名认证页重复填写。','inputmode="tel" maxlength="11" autocomplete="off"')}${field('address.region','所在地区',state.address.region,'省 / 市 / 区','','maxlength="60" autocomplete="off"')}${field('address.detail','详细地址',state.address.detail,'街道、楼栋、门牌号','','maxlength="120" autocomplete="off"')}</div></div>`}
function addressCard(a,editable=false){return `<section class="card detail-address" ${editable?'role="button" tabindex="0" data-act="edit-address"':''}><span class="detail-pin"><svg viewBox="0 0 24 28" fill="none"><path d="M21 11C21 19 12 27 12 27S3 19 3 11a9 9 0 1 1 18 0Z" fill="#55be5b"/><circle cx="12" cy="11" r="3" fill="#fff"/></svg></span><div><strong>${esc(a.name)}${esc(a.phone)}</strong><p>${esc(a.region+' '+a.detail)}</p></div>${editable?'<span class="chev">›</span>':''}</section>`}
function checkoutScreen(){return `<div class="phone-content checkout-v14">${hasAddress()?addressCard(state.address,true):'<button class="card address-empty" data-act="edit-address">＋ 请填写收货地址 ›</button>'}<div class="card detail-product-card">${productHead()}${rentDates(state.period)}</div>${bill(totals(state.period))}<div class="card checkout-expectation"><b>付款后还需完成</b><p>填写姓名、身份证号 → 进入爱签完成人脸识别与协议签署 → 订单待审核</p></div>${state.error.checkout?`<p class="error">${esc(state.error.checkout)}</p>`:''}</div>`}
function authScreen(){const o=current();if(!o||!o.paid)return '<div class="empty">付款成功后进入实名认证。</div>';return `<div class="phone-content auth-v14"><div class="payment-success-note"><span>✓ 首期已支付</span><b>¥${o.total}</b></div><div class="hero-auth"><h2>实名认证，安心租赁</h2><p>完成后进入爱签进行人脸识别与协议签署</p></div><div class="card">${field('identity.name','真实姓名',o.identity.name,'请输入本人真实姓名','租赁服务需要实名认证，请填写与身份证一致的本人姓名。','maxlength="30" autocomplete="off"')}<label class="field"><span class="field-label">身份证号</span><div class="input-wrap"><input data-field="identity.id" value="${esc(o.identity.id)}" type="password" placeholder="请输入本人18位身份证号" maxlength="18" autocomplete="off"><button class="eye" data-act="show-id" aria-label="切换身份证号显示">显示</button></div><small class="notice">完成人脸识别及在线租赁协议签署后，订单将进入待审核状态。</small>${state.error['identity.id']?`<p class="error" role="alert">${esc(state.error['identity.id'])}</p>`:''}</label></div><div class="privacy">仅需填写两项信息，无需上传身份证照片</div>${state.error.auth?`<p class="error auth-error" role="alert">${esc(state.error.auth)}</p>`:''}${o.certDone&&!o.signed?'<div class="info-band">人脸识别已完成，可继续在爱签完成协议签署。</div>':''}</div>`}
function providerScreen(){const o=current();if(!o)return '<div class="empty">请先付款并填写实名信息。</div>';const done=o.providerStep==='success';return `<div class="h5-page"><div class="h5-subnav"><button data-act="leave-provider" aria-label="返回租赁订单">‹</button><span>${done?'实名认证':'SmartCA实名认证'}</span></div>${done?`<div class="h5-success"><div>✓</div><h3>实名认证成功!</h3><p>已为您申请SmartCA数字证书</p><p>将在（${state.h5ReturnMode==='stay'?'0':'2'}）秒后返回</p></div>`:o.providerStep==='sms'?`<div class="h5-content"><div class="h5-phone-logo"><span>▯</span>手机号认证</div><div class="h5-certificate"><b>◉ 基础证书申请</b><p>当前方式仅可申请基础证书。</p></div><div class="h5-mobile-tip">ⓘ 您正在使用手机号认证，请确保此手机号已经在运营商处实名开通。</div><div class="h5-info-row">您的姓名：<span>${esc(o.identity.name)}</span></div><div class="h5-info-row">您的身份证号：<span>${maskID(o.identity.id)}</span></div><div class="h5-info-row">本人手机号：<span>${esc(o.address.phone)}</span></div><label class="h5-sms-label">短信验证码：</label><div class="h5-sms-input"><input data-sms="code" value="${esc(o.smsCode||'')}" inputmode="numeric" maxlength="6" placeholder="请输入短信验证码" autocomplete="off"><button data-act="send-sms" class="sms-get-code">获取验证码</button></div>${o.providerError?`<p class="error" role="alert">${esc(o.providerError)}</p>`:''}<button class="h5-next" data-act="h5-next">下一步</button></div>`:`<div class="h5-content h5-intro"><div class="smartca-logo" aria-label="SmartCA 标识示意">C<span>Λ</span></div><p>为满足您的业务需求，需要您使用认证服务，可能采集如下信息：</p><ul><li>操作人姓名、证件号</li><li>电话号码及其他手机号（仅供校验获取）</li></ul><label class="h5-intro-consent"><input type="checkbox" data-check="h5Consent" ${o.h5Consent?'checked':''}><span>本人在此声明：所填信息完全属实且我已阅读并同意 <button data-h5-agreement="0">《电子认证服务协议》</button>、<button data-h5-agreement="1">《隐私认证授权协议》</button> 和 <button data-h5-agreement="2">《自动电子签名授权书》</button>，同意申请SmartCA证书</span></label>${o.providerError?`<p class="error" role="alert">${esc(o.providerError)}</p>`:''}<button class="h5-start" data-act="h5-start">开始认证</button><div class="h5-provider-tip">温馨提示：<br>请按认证页面指引操作，完成后返回租赁小程序。</div></div>`}</div>`}
function launchH5(o){if(!o?.paid)return;if(!o.appConsent||!o.identity.name||!validID(o.identity.id)){go('auth');return}o.providerError='';o.providerStep=o.certDone?'success':(o.h5Consent?'sms':'intro');state.page='aiqian';state.modal=null;render();if(o.certDone&&state.h5ReturnMode==='auto')timer=setTimeout(()=>completeH5(o),1200)}
function completeH5(o){cancelAsync();if(!o||!o.certDone)return;o.providerError='';state.modal=null;state.page='order';if(state.signResult!=='success'){o.signed=false;o.syncUnknown=false;render();toast('爱签已返回：认证完成，协议签署尚未完成');return}o.signed=true;if(state.syncResult==='timeout'){o.syncUnknown=true;o.accepted=false;render();toast('签署已完成，订单结果需查询确认');return}o.syncUnknown=false;o.accepted=true;render();toast('爱签认证及签署完成，订单进入待审核')}
function h5Agreement(){const titles=['《电子认证服务协议》','《隐私认证授权协议》','《自动电子签名授权书》'];return `<div class="overlay h5-agreement-overlay"><section class="h5-agreement-sheet" role="dialog" aria-modal="true" aria-label="SmartCA服务协议"><p class="h5-agreement-tip">同意以下协议，视为您同意服务方采集必要信息进行身份核验，并申请证书。</p>${titles.map((x,i)=>`<button class="h5-accordion" data-h5-accordion="${i}">${x}<span>${state.h5Accordion===i?'⌃':'⌄'}</span></button>${state.h5Accordion===i?`<div class="h5-accordion-body"><h4>${x}</h4><p>本页按您提供的SmartCA H5参考还原协议查看形式。</p><p>正式服务中展示服务方实际协议全文，相关认证、隐私授权及电子签名授权由爱签H5承接。</p><p>原型不提交真实身份信息、不申请真实证书、不构成实际签署。</p></div>`:''}`).join('')}<button class="h5-agreement-close" data-act="close-modal">返回认证页面</button></section></div>`}

function reviewIcon(){return '<svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="21" height="25" rx="3"/><path d="M9 10h10M9 16h7"/><circle cx="23" cy="23" r="6" fill="#ffddab"/><path d="M23 19v4h3"/></svg>'}

function orderScreen(){const o=current();if(!o)return '<div class="phone-content"><div class="empty">暂无订单，请先选品下单。</div><button class="primary" data-act="new-purchase">去选品</button></div>';const review=o.accepted&&!o.cancelled,title=o.cancelled?'已取消':review?'待审核':!o.paid?'待付款':'待认证';const tip=o.cancelled?'您的订单已取消，可重新下单。':review?'订单预计会在48小时内审核发货，请您保持电话畅通。':o.paidUnknown?'付款结果确认中，请先查询付款结果。':!o.paid?'订单未完成首期支付，请及时完成支付。':o.syncUnknown?'爱签已完成签署，请查询签署结果后继续。':'您已完成付款，请继续实名认证与在线租赁协议签署。';return `<div class="native-detail detail-restored"><div class="detail-return-row"><button class="detail-return" data-act="open-list" aria-label="返回订单列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 3-9 9 9 9"/></svg></button></div><header class="native-status"><h2>${reviewIcon()}${title}${!o.paid&&!o.cancelled?'<span class="detail-unpaid-badge">待支付首期</span>':''}</h2><p>${tip}</p></header><div class="native-detail-body">${addressCard(o.address)}${review?reviewInfoCard():''}<section class="card detail-product-card">${productHead(o.days)}${rentDates(o.days)}</section>${o.cancelled?'':review?'':`<section class="material-card"><div class="material-row"><div class="task-icon">◷</div><div class="material-copy"><b>${o.paid?'实名认证与协议签署':'首期付款'}</b><p>${substage(o)}</p></div><button class="native-pill" data-act="continue-order">${o.paidUnknown?'去查询':!o.paid?'去付款':o.syncUnknown?'去查询':o.certDone?'继续签署':'去认证'}</button></div></section>`}${bill(o.total)}<section class="card order-meta"><div class="kv"><span>租赁协议</span><button class="textlink" data-agreement="lease">${o.signed?'查看协议':'待签署'} ›</button></div><div class="kv"><span>交易快照</span><button class="textlink" data-act="snapshot">发生争议时，可作为判断依据 ›</button></div><div class="kv"><span>订单编号</span><span>${o.id}</span></div><div class="kv"><span>订单进度</span><span>${o.cancelled?'已取消':review?'待审核':substage(o)}</span></div><div class="kv"><span>来源渠道</span><span>${o.channel==='alipay'?'支付宝':'美团'}小程序</span></div><div class="kv"><span>创建时间</span><span>${o.createdAt}</span></div><div class="kv cancel-entry"><span>取消订单</span>${o.cancelled?'<span class="cancel-success">订单取消成功</span>':'<button class="textlink" data-act="cancel-order">申请取消 ›</button>'}</div>${o.cancelled?`<div class="kv"><span>取消原因</span><span>${esc(o.cancelReason)}</span></div><div class="kv"><span>取消时间</span><span>${o.cancelledAt}</span></div><div class="refund-state">${o.paid?'退款处理中 · ¥'+o.total+'<br>预计3个工作日内原路退回，以实际到账为准。':'订单未付款，无需退款。'}</div>`:''}</section></div></div>`}
function orderListScreen(){const all=state.orders.filter(o=>o.channel===state.channel),visible=all.filter(o=>state.listTab==='全部'||stageOf(o)===state.listTab);return `<div class="list-tabs real-list-tabs">${tabs.map(t=>`<button data-list="${t}" class="${state.listTab===t?'selected':''}">${t}</button>`).join('')}</div>${visible.length?visible.map(o=>`<div class="list-order"><div class="order-shop">雕马闪租 ›<span class="order-list-status">${o.cancelled?'已取消':o.accepted?'待审核':o.paid?'待认证':o.paidUnknown?'付款确认中':'待付款'}</span></div>${productHead(o.days)}<div class="list-info">订单号：${o.id}<br>${o.paid?'首期已支付 ¥'+o.total+'<br>':'首期待支付 ¥'+o.total+'<br>'}租期：${startDate} 至 ${endDate(o.days)}<br>${o.cancelled?(o.paid?'已取消，退款处理中':'已取消，未付款'):o.accepted?'付款、实名认证与协议签署均已完成':substage(o)}</div>${canSupplement(o)?`<div class="list-material"><span>身份证照片待补充 · 非必传</span><button class="textlink" data-order-photos="${o.id}">去补充 ›</button></div>`:''}<div class="list-button"><button class="outline-btn" data-open-order="${o.id}">查看详情</button>${!o.accepted&&!o.cancelled?`<button class="outline-btn strong-action" data-continue-order="${o.id}">${o.paidUnknown||o.syncUnknown?'查询结果':!o.paid?'继续付款':o.certDone?'继续签署':'去认证'}</button>`:''}</div></div>`).join(''):'<div class="empty list-empty"><div>✉</div>暂无订单</div>'}`}
function photoSlot(side,label){const photo=state[side==='front'?'uploadFront':'uploadBack'];return `<div class="photo-slot-wrap"><button class="photo-slot ${photo?'has-photo':''}" data-photo-side="${side}" ${state.uploadUnknown?'disabled':''} aria-label="${photo?'重新选择':'上传'}身份证${label}">${photo?`<img src="${esc(photo.url)}" alt="身份证${label}本地预览"><span class="photo-reselect">重新选择${label}</span>`:`<div class="id-illustration ${side}"><span class="id-avatar"></span><span class="id-lines"></span></div><span class="camera-icon">▣</span><span class="upload-label">上传身份证<br><b>${label}</b></span>`}</button><div class="photo-slot-label">${label}<span>${photo?'已选择':'未选择'}</span></div></div>`}
function photosScreen(){const o=current();if(!o?.accepted||o.cancelled)return '<div class="phone-content"><div class="empty">此资料仅在待审核中选填，可先完成下单。</div></div>';return `<div class="phone-content photo-page"><div class="photo-security">请拍摄本人身份证原件，保证照片完整、清晰。</div><h2>完善审核信息</h2><p class="photo-intro">以下资料可选填，提交后返回待审核订单，不影响当前审核状态。</p>${state.uploadUnknown?'<div class="photo-result warning">提交结果确认中，请查询提交结果。</div>':''}${state.error.photos?`<p class="error photo-error" role="alert">${esc(state.error.photos)}</p>`:''}${!state.hasUploadedId?`<h3>上传身份证 <span class="optional-badge">非必传</span></h3><div class="photo-grid">${photoSlot('front','人像面')}${photoSlot('back','国徽面')}</div>`:'<div class="photo-result">✓ 身份证已补充，无需重复上传</div>'}<div class="card photo-identity"><div class="kv"><span>姓名</span><span>${esc(o.identity.name.slice(0,1)||'演')}**</span></div><div class="kv"><span>身份证号</span><span>${maskID(o.identity.id)}</span></div><label class="review-email-field"><span>邮箱</span><input type="email" data-review-email value="${esc(state.reviewEmail)}" placeholder="请输入邮箱（选填）" autocomplete="off"></label></div><p class="review-email-tip">ⓘ 邮箱用于接收审核相关信息，请填写本人常用邮箱。</p><div class="card photo-tips"><h3>温馨提示</h3><p>身份证照片支持 JPG、PNG、WebP，每张不超过10MB。请确保边框完整、字迹清晰。</p><p>身份证照片成功上传一次后，后续下单不再显示上传入口。邮箱和照片均为选填，请按需完善。</p></div><button class="secondary" data-act="return-order">暂不完善，返回订单</button><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><input id="photoCamera" type="file" accept="image/*" capture="environment" hidden></div>`}

function footer(){const o=current();if(state.page==='product')return '<div class="phone-footer"><button class="primary" data-act="rent-now">立即租赁</button></div>';if(state.page==='address')return '<div class="phone-footer"><button class="primary" data-act="save-address">保存收货信息</button></div>';if(state.page==='checkout')return `<div class="phone-footer"><div class="price-footer"><div class="price-total">首期 <b>¥${totals(state.period)}</b></div><button class="primary" data-act="pay-now">立即付款</button></div><p class="footer-tip">付款后继续实名认证与在线租赁协议签署</p></div>`;if(state.page==='auth'&&o?.paid)return `<div class="phone-footer"><label class="consent two-agreements"><input type="checkbox" data-check="appConsent" ${o.appConsent?'checked':''}><span>我已阅读并同意 <button class="textlink" data-agreement="identity">《实名认证授权说明》</button>和<button class="textlink" data-agreement="lease">《签署在线租赁协议》</button></span></label><button class="primary" data-act="confirm-auth">确认人脸识别</button><p class="footer-tip">将进入爱签完成人脸识别与协议签署</p></div>`;if(state.page==='aiqian'&&o)return '';if(state.page==='order'&&o)return `<div class="phone-footer native-order-footer"><button class="native-footer-button" data-act="support">联系商家</button>${o.cancelled?'<button class="native-footer-button green" data-act="new-purchase">再来一单</button>':o.accepted?'<button class="native-footer-button" data-act="open-list">订单列表</button>':`<button class="native-footer-button" data-act="open-list">订单列表</button><button class="native-footer-button green" data-act="continue-order">${o.paidUnknown||o.syncUnknown?'查询结果':!o.paid?'支付':o.certDone?'继续签署':'去认证'}</button>`}</div>`;if(state.page==='photos'&&o?.accepted&&!o.cancelled)return `<div class="phone-footer">${state.uploadUnknown?'<button class="primary" data-act="query-upload">查询提交状态</button>':`<label class="consent"><input type="checkbox" data-check="photoConsent" ${state.photoConsent?'checked':''}><span>如补充身份证照片，我已阅读并同意 <button class="textlink" data-agreement="photo">《身份证照片使用授权说明》</button></span></label><button class="primary" data-act="submit-photos">提交审核资料</button>`}</div>`;if(state.page==='list')return '<div class="phone-footer"><button class="primary" data-act="new-purchase">再下一单</button></div>';return ''}
function sesameModal(){const o=current();return `<div class="overlay sesame-overlay"><section class="sheet sesame-sheet" role="dialog" aria-modal="true" aria-label="芝麻免押授权弹层"><button class="sesame-close" data-act="cancel-sesame" aria-label="关闭芝麻授权">×</button><div class="sesame-brand">◕ 芝麻信用</div><div class="sesame-title-row"><div><h2>本单将计入芝麻分评估</h2><p>完成订单有机会涨芝麻分</p></div><div class="sesame-ring"><span>✓</span></div></div><div class="sesame-summary"><p>•　共1期，第一期租金 <strong>¥${o.total}</strong></p><button data-agreement="sesame">详情 ›</button><p>•　按时归还避免产生额外费用</p></div><p class="sesame-provider">本服务由 <b>雕马闪租</b> 提供</p><div class="sesame-flex-space"></div><button class="sesame-confirm" data-act="confirm-sesame">确定</button><p class="sesame-protocol">请仔细阅读 <button data-agreement="sesame">《芝麻信用商业服务协议》</button>、<button data-agreement="sesame">《付款授权服务协议》</button>，同意协议请点击按钮。</p></section></div>`}
function meituanRentSheet(){const o=current();return `<div class="overlay"><section class="sheet mt-rent-sheet" role="dialog" aria-modal="true" aria-label="订单提交成功"><div class="sheet-top"><h2>提交成功!</h2><button data-act="cancel-payment" aria-label="关闭首期支付">×</button></div><p class="mt-lock-tip">立即支付首期租金，抢先锁定商品库存</p><h3>需支付</h3><div class="mt-rent-amount">${o.total}元</div><div class="mt-first-rent"><span>第一期租金</span><b>¥${o.total}</b></div><p class="mt-refund-copy">取消及退款按现有订单规则处理</p><button class="primary" data-act="launch-meituan-pay">立即支付</button></section></div>`}
function meituanCashier(){const o=current(),method=o.paymentMethod||'month';const row=(id,icon,title,sub='')=>`<button class="mt-method" data-pay-method="${id}"><span class="mt-method-icon ${id==='alipay'?'ali':''}">${icon}</span><span>${title}${sub?`<small>${sub}</small>`:''}</span><i class="${method===id?'checked':''}">${method===id?'✓':''}</i></button>`;return `<div class="overlay mt-cashier-overlay"><section class="mt-cashier" role="dialog" aria-modal="true" aria-label="美团支付收银台"><header><button data-act="cancel-payment" aria-label="退出美团支付">‹</button><b>订单</b></header><div class="mt-pay-amount"><p>交易剩余时间 23:59:49</p><strong><small>¥</small>${o.total}</strong></div><div class="mt-cashier-scroll"><p class="mt-group-label">金融服务</p><div class="mt-method-card"><div class="mt-official">♙　美团官方出品</div>${row('month','月付','美团月付','先消费后还款')}${row('installment','分期','美团月付·分期','可用期数及费用以实际收银台为准')}</div><p class="mt-group-label">支付方式</p><div class="mt-method-card">${row('meituan','◆','美团支付')}${row('bank','卡','银行卡支付','演示银行卡，不展示真实卡信息')}</div><p class="mt-group-label">其他支付方式</p><div class="mt-method-card">${row('alipay','支','支付宝支付')}</div></div><footer><button data-act="confirm-payment">${method==='month'?'月付交易':method==='installment'?'分期支付':'确认支付'}</button><small>原型演示，不调用真实支付或产生扣款</small></footer></section></div>`}


function requestExit(kind){state.modal={type:'retention',kind,resume:state.modal};render()}
function retentionModal(m){const o=current(),copy={payment:['就差一步，完成支付',`订单已提交，租金 ¥${o.total} 尚未支付。继续支付后即可进入实名认证与协议签署。`,'暂不支付','继续支付'],unpaid:['这笔订单还未付款','商品和收货信息已保存，现在即可完成首付。离开后，也可在“待认证”列表继续付款。','先离开','去付款'],auth:['已支付，请完成认证','完成人脸识别与协议签署后，订单才能进入待审核。','稍后认证','继续认证']}[m.kind];return `<div class="overlay retention-overlay"><section class="retention-dialog" role="dialog" aria-modal="true" aria-label="${copy[0]}"><div class="retention-icon">${m.kind==='auth'?'✓':'¥'}</div><h2>${copy[0]}</h2><p>${copy[1]}</p><div class="retention-actions"><button class="secondary" data-act="exit-confirm">${copy[2]}</button><button class="primary" data-act="exit-stay">${copy[3]}</button></div></section></div>`}
const cancelReasons=['押金问题','租金问题','多拍/拍错','收货信息有误','商品问题','审核流程/时长问题','发货问题','我不想要了/计划有变'];
function cancelReasonsModal(){const o=current();return `<div class="overlay"><section class="sheet cancel-reasons-sheet" role="dialog" aria-modal="true" aria-label="取消原因"><div class="sheet-top"><h2>取消原因</h2><button data-act="close-modal" aria-label="关闭取消原因">×</button></div><p class="cancel-refund-tip">${o.paid?'订单取消后，如有付款，将会在3个工作日内原路退回':'此订单尚未付款，取消后无需退款。'}</p><div class="cancel-reason-list">${cancelReasons.map(r=>`<button data-cancel-reason="${r}" aria-pressed="${state.cancelReason===r}" class="${state.cancelReason===r?'selected':''}"><span>${r}</span><i>${state.cancelReason===r?'●':'○'}</i></button>`).join('')}</div>${state.error.cancel?`<p class="cancel-error">${state.error.cancel}</p>`:''}<div class="cancel-actions"><button class="secondary" data-act="confirm-cancel">确定取消</button><button class="primary" data-act="close-modal">暂不取消</button></div></section></div>`}

function modal(){const m=state.modal,o=current();if(!m)return '';if(m.type==='retention')return retentionModal(m);if(m.type==='cancel-reasons')return cancelReasonsModal();if(m.type==='rent-payment')return meituanRentSheet();if(m.type==='mt-cashier')return meituanCashier();if(m.type==='sesame')return sesameModal();if(m.type==='h5-agreement')return h5Agreement();let content='';if(m.type==='busy')content=`<div class="center"><div class="spinner"></div><h2>${esc(m.title)}</h2><p>正在模拟处理，请稍候…</p></div>`;if(m.type==='payment')content=`<div class="sheet-top"><h2>${channelName()}支付</h2><button data-act="close-modal" aria-label="关闭支付">×</button></div><p>订单已生成：${o.id}</p><div class="payment-modal-amount">¥${o.total}</div><p>此为原型支付演示，不产生真实扣款。</p><button class="primary" data-act="confirm-payment">模拟确认付款</button><button class="secondary" data-act="cancel-payment">取消付款</button>`;if(m.type==='photo-consent')content='<h2>身份证照片使用授权</h2><p>您正在自愿补充本人的身份证人像面、国徽面，用于订单审核参考。也可暂不提供，继续等待审核。</p><button class="primary" data-act="accept-photo">同意并继续选图</button><button class="secondary" data-act="close-modal">暂不提供</button>';if(m.type==='photo-source')content=`<div class="sheet-top"><h2>选择身份证${state.photoSide==='front'?'人像面':'国徽面'}</h2><button data-act="close-modal" aria-label="关闭选图">×</button></div><button class="source-option" data-act="choose-camera">拍照</button><button class="source-option" data-act="choose-album">从相册选择</button><button class="secondary" data-act="close-modal">取消</button>`;if(m.type==='snapshot')content=`<h2>交易快照</h2><p>订单 ${o.id}</p><p>大疆Pocket4Pro · 标准版<br>租期 ${o.days}天 · 商品租金 ¥${o.total}<br>配送：顺丰速运，寄出包邮，归还自付</p><p>展示下单时商品与租赁约定的留档快照（原型示意）。</p><button class="primary" data-act="close-modal">返回订单</button>`;if(m.type==='support')content='<h2>联系商家</h2><p>正式小程序沿用当前商家客服入口，并携带订单号；本原型仅展示入口。</p><button class="primary" data-act="close-modal">返回页面</button>';if(m.type==='cancel')content='<h2>取消订单</h2><p>正式小程序沿用已有取消及退款流程，本原型不处理真实取消或退款。</p><button class="primary" data-act="close-modal">返回订单</button>';if(m.type==='agreement'){const copy={identity:['实名认证授权说明','为完成租赁实名认证，将使用您填写的本人姓名、身份证号码及收货时已采集的手机号，并由爱签完成人脸识别及相关身份核验。','此为原型说明，正式协议沿用实际业务文本。'],lease:['在线租赁协议（示意）',`本订单租赁商品为大疆Pocket4Pro，租期${o?.days||state.period}天，商品租金¥${o?.total||totals(state.period)}。签署由爱签服务完成。`,'此内容仅为原型演示，不构成真实协议或签约。正式环境应展示本订单实际在线租赁协议。'],photo:['身份证照片使用授权说明','您可自愿提供本人身份证人像面、国徽面照片，用于审核参考。未提供不阻止订单进入待审核。','此原型仅在本页内存预览图片，不上传服务器。'],sesame:['芝麻信用授权说明','正式环境调起支付宝芝麻信用原生界面，协议和授权结果以实际服务为准。','此为交互模拟，不进行真实授权或资金操作。']}[m.kind];content=`<div class="sheet-top"><h2>${copy[0]}</h2><button data-act="close-agreement" aria-label="关闭协议">×</button></div><p>${copy[1]}</p><p>${copy[2]}</p><button class="primary" data-act="close-agreement">我知道了</button>`}return `<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${m.type==='payment'?'支付演示':m.type==='busy'?'处理中':m.type==='agreement'?'协议说明':'操作说明'}">${content}</section></div>`}
function phoneSteps(){if(['product','order','photos','list','aiqian'].includes(state.page))return '';const index=['address','checkout'].includes(state.page)?0:1;return `<div class="mobile-steps">${['确认下单','实名签署','下单完成'].map((x,i)=>`<span class="${index===i?'current':i<index?'passed':''}"><i>${i<index?'✓':i+1}</i>${x}</span>${i<2?'<em></em>':''}`).join('')}</div>`}
function workbench(){const o=current(),native=state.page==='order'&&o;const title={product:'商品详情',address:'收货地址',checkout:'确认订单',auth:'实名认证',aiqian:(o?.providerStep==='success'?'实名认证成功':'SmartCA实名认证'),order:'订单详情',photos:'完善审核信息',list:'订单列表'}[state.page];const screens={product:productScreen,address:addressScreen,checkout:checkoutScreen,auth:authScreen,aiqian:providerScreen,order:orderScreen,photos:photosScreen,list:orderListScreen};return `<div class="workbench"><section class="stage"><div class="stage-label"><span>${channelName()}小程序 / 新下单链路</span><button data-act="new-purchase">↻ 从头下单</button></div><div class="phone ${isAli()?'alipay':''} ${state.page==='aiqian'?'aiqian-phone':''} ${native?'order-detail '+(o.cancelled?'is-cancelled':!o.paid?'is-unpaid':'is-review'):''}" id="phone"><div class="statusbar"><span>9:41</span><span class="status-icons">▮▮▮ ᴡɪғɪ ▰</span></div><div class="appbar"><button data-act="back" aria-label="返回上一页">‹</button><span class="app-title">${title}</span><span class="capsule">••• │ ◉</span></div>${phoneSteps()}<div class="phone-main" id="phoneMain">${screens[state.page]()}</div>${footer()}${modal()}</div><div class="workbench-bottom"><span>订单、支付、爱签与上传均为演示</span><button class="bottom-action" data-tab="flow">查看完整链路 ↗</button></div></section><aside class="note-panel">${notes()}</aside></div>`}
const noteData={product:['下单从选品开始','先选品、填地址和确认订单，直接发起付款。',['付款前不采集实名','姓名、身份证号以及在线租赁协议签署均放到付款后。'],['每次下单独立签署','每笔新订单仍需完成该订单的实名认证与协议签署。']],address:['手机号只在地址采集','认证时复用地址手机号，不在实名认证页展示。',['配送信息一次收齐','校验收货人、手机号、地区和详细地址。'],['付款前确认信息','收货信息以本次确认订单时的内容生成订单快照。']],checkout:['先付款，订单即生成','点击立即付款创建订单并发起支付；付款成功后直接进入实名认证。',['失败不重复创建','支付取消、失败可继续原订单；结果未明先查询。'],['美团调起原生支付','本期仅调整美团小程序，无免押步骤；付款成功后进入实名认证。']],auth:['付款后才实名认证','只输入姓名和身份证号，确认两份说明后跳转爱签。',['按钮上方展示两份协议','《实名认证授权说明》和《签署在线租赁协议》使用同一勾选确认。'],['完成人脸与签署后审核','填写信息或人脸通过均不等于进入待审核，还需完成本单协议签署。']],aiqian:['直接调起爱签H5','按您提供的SmartCA H5还原参考，不自建闪租的人脸识别或签署页面。',['服务方页面自行承接','协议授权、手机号验证码认证、证书成功与返回均在H5中完成。'],['认证成功不等于已签署','小程序仅在服务端确认认证和本单协议签署均完成后，才进入待审核。']],order:['保留原订单详情布局','继续使用地址、商品租期、费用明细和底部操作，按新顺序展示状态。',['未完成步骤归待认证','未付款、待实名、待签署及签署结果确认中，均归入待认证分类。'],['身份证补充非必传','只有该用户从未成功上传过才展示；不影响订单进入待审核。']],photos:['用户级历史，只需上传一次','身份证照片为自愿补充项，记录的是用户是否曾成功上传。',['未提交成功不算上传过','仅选图、取消、失败和结果不明都不更新历史记录。'],['新订单不再重复展示','成功补充后立即隐藏入口，后续下单仍复用该用户上传历史。']],list:['沿用实际订单列表分类','保留全部、待认证、审核中、待发货等，不新增待付款列。',['待认证涵盖未完成链路','同属待认证分类：未付卡片显示待付款并提供继续付款；已付未认证卡片显示待认证并提供去认证。'],['历史资料独立于订单','再次下单保留用户历史上传标记，新订单不重复出现选填模块。']]};
function options(value,arr){return arr.map(([v,t])=>`<option value="${v}" ${v===value?'selected':''}>${t}</option>`).join('')}
function notes(){const n=noteData[state.page];return `<header><span class="tag">${String(pages.filter(p=>p[0]!=='product').findIndex(p=>p[0]===state.page)+1).padStart(2,'0')} / 新流程</span><h2>${n[0]}</h2><p class="intro">${n[1]}</p></header>${n.slice(2).map((x,i)=>`<div class="note"><span class="note-number">${i+1}</span><div><b>${x[0]}</b><p>${x[1]}</p></div></div>`).join('')}<section class="scenario-box"><h3>流程结果演示</h3><p>右侧开关仅影响模拟结果，不调用真实接口。</p><label>首期支付<select data-scenario="payResult" aria-label="首期支付结果">${options(state.payResult,[['success','付款成功'],['failed','付款失败'],['cancelled','取消付款'],['timeout','结果超时']])}</select></label>${isAli()?`<label>芝麻授权<select data-scenario="sesameResult" aria-label="芝麻授权结果">${options(state.sesameResult,[['success','授权完成'],['failed','未通过'],['cancelled','取消'],['timeout','结果超时']])}</select></label>`:''}<label>H5认证<select data-scenario="authResult" aria-label="H5认证结果">${options(state.authResult,[['success','认证通过'],['failed','认证失败'],['cancelled','用户取消'],['timeout','结果超时']])}</select></label><label>协议签署<select data-scenario="signResult" aria-label="H5返回的签署状态">${options(state.signResult,[['success','认证及签署完成'],['pending','仅认证成功，未签署'],['failed','签署失败'],['cancelled','用户取消']])}</select></label><label>结果同步<select data-scenario="syncResult" aria-label="签署同步结果">${options(state.syncResult,[['success','同步成功'],['timeout','超时，需查询']])}</select></label>${state.page==='aiqian'?`<label>H5成功页<select data-scenario="h5ReturnMode" aria-label="H5返回模式">${options(state.h5ReturnMode,[['auto','自动返回'],['stay','停留预览']])}</select></label><p class="demo-hint">演示短信验证码：123456。仅模拟，不发送短信。</p>${current()?.providerStep==='success'?'<button class="demo-btn" data-act="manual-h5-return">模拟H5返回小程序</button>':''}`:''}<button class="demo-btn" data-act="fill-demo">＋ 填入演示信息</button></section><section class="photo-scenarios"><h3>同一演示用户的身份证历史</h3><div class="history-state ${state.hasUploadedId?'uploaded':''}">${state.hasUploadedId?'✓ 曾上传过，后续不再显示':'○ 从未上传，待审核中显示选填模块'}</div><button class="demo-btn" data-act="toggle-history">${state.hasUploadedId?'切换为从未上传':'切换为历史已上传'}</button>${state.page==='photos'?`<label>资料提交<select data-scenario="uploadResult" aria-label="资料提交结果">${options(state.uploadResult,[['success','提交成功'],['failed','提交失败'],['timeout','结果超时']])}</select></label><button class="demo-btn" data-act="sample-photos">＋ 载入两面演示样图</button>`:''}<p class="demo-hint">仅保存演示用户的“曾上传”布尔标记；照片和身份信息不持久化。“从头下单”保留此历史。</p></section>`}
function flow(){return `<section class="overview"><div class="overview-banner"><div><h2>先付款，再实名与签署。</h2><p>确认下单 → 提交成功 / 首期租金 → 调起美团支付→ 付款成功 → 实名签署（爱签H5）→ 下单完成（待审核）</p></div></div><div class="flow-grid">${pages.filter(p=>p[0]!=='product').map((p,i)=>`<button class="flow-card ${['checkout','auth','aiqian','photos'].includes(p[0])?'focus':''}" data-preview="${p[0]}"><span class="flow-num">STEP ${String(i+1).padStart(2,'0')}</span><span class="arrow">↗</span><h3>${p[1]}</h3><p>${noteData[p[0]][1]}</p></button>`).join('')}</div><div class="flow-footer"><b>订单状态：</b>发起付款即创建订单；未付款、已付款待实名、待签署及结果确认中，均归入订单列表“待认证”。爱签完成人脸与签署并同步成功，进入“审核中”。<br><b>完善审核信息：</b>待审核页沿用审核资料组件 → 上传身份证 / 完善邮箱 → 选填资料 → 提交成功返回待审核。邮箱可单独提交，身份证两面完整且授权后提交；不会改变审核状态。<br><b>可选资料：</b>待审核且用户从未成功上传过身份证 → 显示“待补充 · 非必传”；任一订单成功上传一次 → 更新用户历史 → 本单与后续订单均不再展示该模块。<br><b>本期范围：</b>仅美团小程序，无免押流程；付款成功后进入实名认证与爱签签署。</div></section>`}
function rules(){return `<section class="rules"><div class="rules-grid"><article class="rule-card"><h2>01　新的强制顺序</h2><p>确认收货地址和订单后直接发起付款并创建订单；支付成功后跳转实名认证。填写姓名和身份证号，勾选两份授权及协议，点击“确认人脸识别”进入爱签。爱签完成人脸识别及该订单协议签署后，同步结果并进入待审核。</p><div class="copy-box">我已阅读并同意《实名认证授权说明》和《签署在线租赁协议》</div><p>该确认文字位于“确认人脸识别”按钮正上方。实名认证页不展示手机号、不上传身份证照片。</p></article><article class="rule-card"><h2>02　订单列表映射</h2><table><tr><th>实际进度</th><th>列表分类</th><th>操作</th></tr><tr><td>未完成首期支付</td><td>待认证</td><td>继续付款</td></tr><tr><td>已付款，未实名</td><td>待认证</td><td>去认证</td></tr><tr><td>H5认证完成，未签署</td><td>待认证</td><td>继续签署</td></tr><tr><td>签署结果确认中</td><td>待认证</td><td>查询结果</td></tr><tr><td>爱签完成并同步</td><td>审核中</td><td>查看详情</td></tr></table><p>不设“待付款”列表分类；详情可保留待支付首期提示。</p></article><article class="rule-card"><h2>03　身份证照片非必传、用户级去重</h2><p>展示条件仅为：订单待审核，并且用户从未成功上传过身份证照片。它是选填资料，不阻断下单、签署或进入待审核。</p><p>成功上传一次后更新用户历史，后续下单不再展示。选图、取消、提交失败及结果未知不算已上传。正式环境由用户资料服务返回历史标记；不以每单字段或资料核验状态决定是否重复展示。</p></article><article class="rule-card"><h2>04　原型与接入边界</h2><p>本期仅调整美团小程序，付款后进入实名与爱签流程，不包含免押步骤。现有订单详情的橙色审核背景、地址、商品租期、费用和底部动作继续保留。</p><p>付款、爱签和上传均为交互模拟。仅用户“曾上传过”的演示布尔标记保存在本地；照片、实名信息和订单仅在本页内存中，刷新清除。正式环境需对接实际支付、爱签回调、用户档案及状态查询。</p></article></div></section>`}

function render(){const o=current();$$('[data-channel]').forEach(b=>{b.classList.toggle('active',b.dataset.channel===state.channel);b.setAttribute('aria-pressed',String(b.dataset.channel===state.channel))});$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));$('#pageNav').innerHTML=pages.filter(p=>p[0]!=='product').map((p,i)=>`<button class="navitem ${state.page===p[0]&&state.tab==='demo'?'active':''}" data-preview="${p[0]}"><span class="navnum">${String(i+1).padStart(2,'0')}</span>${p[1]}${p[2]?`<span class="tiny-tag">${p[2]}</span>`:''}</button>`).join('');$('#workspace').innerHTML=state.tab==='demo'?workbench():state.tab==='flow'?flow():rules();bind();updateSMSLabel()}
function openPayment(){const o=current();if(!o)return;if(o.paid){go('auth');return}if(isAli()&&!o.sesameAuthorized){state.modal={type:'sesame'};render();return}state.modal={type:isAli()?'payment':'rent-payment'};render()}
function continueOrder(o=current()){if(!o)return;if(o.cancelled||o.accepted){go('order');return}if(o.paidUnknown){act('query-payment');return}if(!o.paid){openPayment();return}if(o.syncUnknown){act('query-sign');return}if(o.certDone&&o.appConsent){launchH5(o);return}go('auth')}
function uploadAccepted(){if(state.reviewEmail.trim())state.savedReviewEmail=state.reviewEmail.trim();setHistory(true);clearUpload();state.modal=null;state.page='order';render();toast('审核资料已提交，订单继续待审核')}
function samplePhoto(side){const name=side==='front'?'人像面':'国徽面';const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380"><rect width="600" height="380" rx="20" fill="#edf3e9"/><rect x="20" y="20" width="560" height="340" rx="15" fill="none" stroke="#bdd0b3" stroke-width="3"/><text x="300" y="130" font-size="32" text-anchor="middle" fill="#7b9470" font-family="sans-serif">身份证${name} · 演示样图</text><text x="300" y="275" font-size="25" text-anchor="middle" fill="#b68571" font-family="sans-serif">仅供演示 · 非有效证件</text></svg>`;return {url:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}}
async function receivePhoto(file){if(!file)return;const version=state.uploadVersion,side=state.photoSide;if(!canSupplement(current())||state.uploadUnknown||!side)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024||!file.size){state.modal=null;state.error.photos='请选择JPG、PNG或WebP图片，每张不超过10MB。';render();return}try{const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});await new Promise((resolve,reject)=>{const i=new Image();i.onload=resolve;i.onerror=reject;i.src=url});if(version!==state.uploadVersion||state.uploadUnknown||!canSupplement(current()))return;state[side==='front'?'uploadFront':'uploadBack']={url};state.modal=null;state.error={};render();toast('照片已选择，尚未提交')}catch{if(version!==state.uploadVersion)return;state.modal=null;state.error.photos='无法读取该图片，请重新选择。';render()}}
function updateSMSLabel(){const o=current(),b=$('.sms-get-code');if(!b||!o)return;const remaining=Math.max(0,Math.ceil(((o.smsUntil||0)-Date.now())/1000));b.textContent=remaining?remaining+'秒后重新获取':'获取验证码';b.disabled=remaining>0}
function bind(){const emailInput=$('[data-review-email]');if(emailInput)emailInput.oninput=()=>{state.reviewEmail=emailInput.value;delete state.error.photos};$$('[data-cancel-reason]').forEach(b=>b.onclick=()=>{state.cancelReason=b.dataset.cancelReason;delete state.error.cancel;render()});$$('[data-pay-method]').forEach(b=>b.onclick=()=>{current().paymentMethod=b.dataset.payMethod;render()});$$('[data-act]').forEach(b=>{b.onclick=()=>act(b.dataset.act);if(b.getAttribute('role')==='button')b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(b.dataset.act)}}});$$('[data-preview]').forEach(b=>b.onclick=()=>preview(b.dataset.preview));$$('[data-tab]').forEach(b=>b.onclick=()=>{cancelAsync();state.modal=null;state.tab=b.dataset.tab;render()});$$('[data-period]').forEach(b=>b.onclick=()=>{state.period=+b.dataset.period;render()});$$('[data-field]').forEach(i=>i.oninput=()=>{const [group,key]=i.dataset.field.split('.');if(group==='address')state.address[key]=i.value;else{const o=current();if(!o)return;if(o.certDone&&!o.accepted){o.certDone=false;o.signed=false;o.providerStep='intro';o.h5Consent=false}o.identity[key]=key==='id'?i.value.replace(/\s/g,'').toUpperCase():i.value}delete state.error[i.dataset.field]});$$('[data-sms]').forEach(i=>i.oninput=()=>{if(current())current().smsCode=i.value.replace(/\D/g,'')});$$('[data-check]').forEach(c=>c.onchange=()=>{if(c.dataset.check==='photoConsent')state.photoConsent=c.checked;else if(current())current()[c.dataset.check]=c.checked;if(c.dataset.check==='appConsent'&&c.checked){delete state.error.auth;$('.auth-error')?.remove()}});$$('[data-agreement]').forEach(b=>b.onclick=()=>{state.modal={type:'agreement',kind:b.dataset.agreement,returnTo:state.modal?.type==='sesame'?'sesame':null};render()});$$('[data-h5-agreement]').forEach(b=>b.onclick=()=>{state.h5Accordion=+b.dataset.h5Agreement;state.modal={type:'h5-agreement'};render()});$$('[data-h5-accordion]').forEach(b=>b.onclick=()=>{state.h5Accordion=state.h5Accordion===+b.dataset.h5Accordion?-1:+b.dataset.h5Accordion;render()});$$('[data-scenario]').forEach(s=>s.onchange=()=>{state[s.dataset.scenario]=s.value;if(s.dataset.scenario==='h5ReturnMode'&&current()?.providerStep==='success'&&state.page==='aiqian'){clearTimeout(timer);if(s.value==='auto')timer=setTimeout(()=>completeH5(current()),1200)}});$$('[data-list]').forEach(b=>b.onclick=()=>{state.listTab=b.dataset.list;render()});$$('[data-open-order]').forEach(b=>b.onclick=()=>{state.selectedId=b.dataset.openOrder;go('order')});$$('[data-continue-order]').forEach(b=>b.onclick=()=>{state.selectedId=b.dataset.continueOrder;continueOrder()});$$('[data-order-photos]').forEach(b=>b.onclick=()=>{state.selectedId=b.dataset.orderPhotos;go('photos')});$$('[data-photo-side]').forEach(b=>b.onclick=()=>{if(state.uploadUnknown)return;state.photoSide=b.dataset.photoSide;state.modal={type:state.photoConsent?'photo-source':'photo-consent'};render()});['photoFile','photoCamera'].forEach(id=>{const i=$('#'+id);if(i)i.onchange=()=>receivePhoto(i.files[0])});const overlay=$('.overlay');if(overlay){const b=overlay.querySelector('button');b?.focus();overlay.onkeydown=e=>{if(e.key==='Escape'&&!state.busy)act('close-modal');if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button:not(:disabled),input:not(:disabled)')];if(!controls.length){e.preventDefault();return}if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===controls.at(-1)){e.preventDefault();controls[0].focus()}}}}}
